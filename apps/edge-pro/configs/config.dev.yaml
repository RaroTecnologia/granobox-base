device:
  id: "edge-pro-dev"
  name: "Edge-Pro Development"
  version: "1.0.0-dev"
  location: "Development"
  hostname: ""

socketio:
  server_url: "http://localhost:3000"  # API local
  namespace: "/agents"
  agent_fingerprint: "edge-pro-dev-local"
  api_key: ""  # Configure com token gerado
  reconnect_delay: 2
  local_port: 3001

api:
  port: 8080
  host: "0.0.0.0"

display:
  enabled: false
  service_url: "localhost:3006"
  type: "rgb"

printer:
  auto_detect_usb: false  # Simular em dev
  tcp_printers: []

debug: true


