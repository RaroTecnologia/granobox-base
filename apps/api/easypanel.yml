# Configuração do Easypanel para API do Granobox
name: granobox-api
services:
  - name: granobox-api
    image: 
      dockerfile: Dockerfile
      context: .
    domains:
      - host: api.granobox.com.br  # Substitua pelo seu domínio
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: 3001
      - name: DATABASE_URL
        value: ${DATABASE_URL}
      - name: JWT_SECRET
        value: ${JWT_SECRET}
      - name: JWT_EXPIRES_IN
        value: 7d
      - name: CORS_ORIGINS
        value: ${CORS_ORIGINS}
    ports:
      - published: 80
        target: 3001
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode < 500 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  - name: granobox-db
    image: postgres:15-alpine
    env:
      - name: POSTGRES_DB
        value: granobox
      - name: POSTGRES_USER
        value: granobox
      - name: POSTGRES_PASSWORD
        value: ${POSTGRES_PASSWORD}
    volumes:
      - source: granobox-db-data
        target: /var/lib/postgresql/data
    ports:
      - published: 5432
        target: 5432
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  - name: granobox-db-data
